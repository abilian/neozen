# NeoZen Alembic configuration.
#
# Most projects can use this file as-is. The database URL is taken
# from the NEOZEN_DATABASE_URL environment variable at runtime, so
# the same alembic.ini works in development, in containers, and in
# CI without modification.
#
# Common commands:
#
#     uv run alembic upgrade head
#     uv run alembic downgrade -1
#     uv run alembic current
#     uv run alembic history
#     uv run alembic revision --autogenerate -m "describe your change"

[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Migration filename template — UTC date prefix + slug for stable ordering
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Use UTC timestamps in filenames
timezone = UTC

# Truncate slug to a reasonable length
truncate_slug_length = 40

# sqlalchemy.url is intentionally left empty — env.py reads
# NEOZEN_DATABASE_URL from the environment.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
