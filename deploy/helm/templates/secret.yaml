{{/*
Generate a Secret only if the user did not point at an existing one.
*/}}
{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neozen.fullname" . }}
  labels:
    {{- include "neozen.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEOZEN_SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  NEOZEN_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
{{- end -}}
