image: ubuntu/24.04

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a


environment:
  # System Python is 3.12.3; NeoZen needs >=3.12.4 (PEP 695 get_type_hints fix).
  UV_PYTHON_PREFERENCE: only-managed
  UV_PYTHON: "3.12"

packages:
  # Build tools
  - software-properties-common
  - build-essential
  # Python is 3.12
  - python3-dev
  - python3-pip
  # Extra
  - nodejs

tasks:
  - setup: |
      echo "Building on Ubuntu 2404"
      sudo pip install --break-system-packages -U uv nox
      cd neozen
      uv sync
      uv run playwright install --with-deps chromium

  - test: |
      cd neozen
      uv run pytest -q --tb=short
  - lint: |
      cd neozen
      uv run ruff check
      # uv run ty check src
  - nox: |
      cd neozen
      uvx nox
  - package: |
      cd neozen
      uv build --out-dir /tmp/dist
      # The wheel must install and run with no extra.
      uv venv /tmp/wheel-venv
      VIRTUAL_ENV=/tmp/wheel-venv uv pip install /tmp/dist/*.whl
      cd /tmp && /tmp/wheel-venv/bin/neozen --version
