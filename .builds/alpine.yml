image: alpine/latest
packages:
  - uv
  - gcc
  - python3-dev

secrets:
  - b88a4c2c-944c-42a6-9fbb-7483049c458a

sources:
  - git@git.sr.ht:~sfermigier/neozen

tasks:
  - install: |
      cd neozen
      # Playwright has no musl wheels; browser tests run on Ubuntu.
      uv sync --no-group playwright
  - test: |
      cd neozen
      uv run --no-group playwright pytest -q --tb=short
  - lint: |
      cd neozen
      uv run --no-group playwright ruff check
      uv run --no-group playwright ty check src
