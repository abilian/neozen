{% extends "base.html" %}

{% block title %}Login - NeoZen{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Login</h1>
    <p>Enter your credentials to access your account.</p>

    <form action="/login" method="post">
        <label for="email">
            Email
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="email"
                {% if email %}value="{{ email }}"{% endif %}
            >
        </label>

        <label for="password">
            Password
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Your password"
                required
                autocomplete="current-password"
            >
        </label>

        <button type="submit">Login</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        Don't have an account? <a href="/register">Register here</a>
    </p>

    <div style="margin: 2rem 0; text-align: center;">
        <p style="color: var(--pico-muted-color); margin-bottom: 1rem;">
            <small>Or sign in with</small>
        </p>
        <div class="grid">
            <a href="/magic-login" role="button" class="outline">
                Magic Link
            </a>
            <a href="/email-otp" role="button" class="outline">
                Email OTP
            </a>
        </div>
    </div>
</div>
{% endblock %}
