{% extends "base.html" %}

{% block title %}Magic Link Login - NeoZen{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Magic Link Login</h1>
    <p>Enter your email to receive a sign-in link.</p>

    <form action="/magic-login" method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <label for="email">
            Email
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="email"
            >
        </label>

        <button type="submit">Send Magic Link</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        <a href="/login">Back to password login</a>
    </p>
</div>
{% endblock %}
