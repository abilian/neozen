{% extends "base.html" %}

{% block title %}Two-Factor Authentication - NeoZen{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Two-Factor Authentication</h1>
    <p>Enter the 6-digit code from your authenticator app.</p>

    <form action="{{ url_for('login_totp') }}" method="post">
        <label for="code">
            Authentication Code
            <input
                type="text"
                id="code"
                name="code"
                placeholder="000000"
                pattern="[0-9]{6}"
                maxlength="6"
                required
                autofocus
                inputmode="numeric"
                autocomplete="one-time-code"
            >
        </label>

        <button type="submit">Verify</button>
    </form>

    <details style="margin-top: 1rem;">
        <summary>Lost your authenticator? Use a backup code</summary>
        <form action="{{ url_for('login_backup_code') }}" method="post" style="margin-top: 1rem;">
            <label for="backup_code">
                Backup Code
                <input
                    type="text"
                    id="backup_code"
                    name="backup_code"
                    placeholder="XXXXXXXX"
                    required
                >
            </label>
            <button type="submit" class="outline">Use Backup Code</button>
        </form>
    </details>

    <p style="text-align: center; margin-top: 2rem;">
        <a href="{{ url_for('login') }}">Cancel and go back</a>
    </p>
</div>
{% endblock %}
