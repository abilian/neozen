[project]
name = "neozen"
version = "0.1.0"
description = "Streamlined authentication and authorization for modern Python applications"
readme = "README.md"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0.0",
    "dishka>=1.0.0",
    "email-validator>=2.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
password = [
    "pwdlib[argon2]>=0.3.0",
]
phone = [
    "phonenumbers>=9.0.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
]
all = [
    "neozen[password,phone,sqlalchemy]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neozen"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "nox>=2025.11.12",
    "pre-commit>=4.5.1",
    "pyrefly>=0.47.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
    # Test dependencies
    "trio>=0.27.0",
    "aiosqlite>=0.21.0",
    "phonenumbers>=9.0.0",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
strict_equality = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    "CPY",      # Copyright
    "S101",     # Use of assert
    "D203",     # one-blank-line-before-class
    "D213",     # multi-line-summary-second-line
    "COM812",   # trailing comma
    "T201",     # print
    "ANN",      # annotations (handled by type checkers)
    "D",        # docstrings (for now)
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert
    "PLR2004",  # magic values
    "D",        # docstrings
    "ANN",      # annotations
]

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["neozen"]
