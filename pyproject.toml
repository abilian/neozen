[project]
name = "neozen"
version = "0.9.0"
description = "Streamlined authentication and authorization for modern Python applications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.12.4"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "advanced-alchemy>=1.8.2",
    "alembic>=1.18",
    "anyio>=4.0.0",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "email-validator>=2.3.0",
    "ldap3>=2.9.1",
    "litestar[standard]>=2.19.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.12.1",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
password = [
    "pwdlib[argon2]>=0.3.0",
]
phone = [
    "phonenumbers>=9.0.0",
]
totp = [
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
]
oauth-client = [
    "httpx>=0.28.0",
]
webauthn = [
    "webauthn>=2.0.0",
]
oidc = [
    "pyjwt[crypto]>=2.10.0",
]
ldap = [
    "ldap3>=2.9.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
    "advanced-alchemy>=0.30.0",
]
peewee = [
    "peewee>=3.17.0",
    "aiosqlite>=0.21.0",  # For async SQLite support
]
tortoise = [
    "tortoise-orm[asyncpg]>=0.22.0",
    "aiosqlite>=0.21.0",
]
databases = [
    "databases[aiosqlite]>=0.9.0",
]
demo = [
    "starlette>=0.40.0",
    "litestar>=2.0.0",
    "flask[async]>=3.0.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.0.0",
]
all = [
    "neozen[password,phone,totp,oauth-client,webauthn,oidc,ldap,sqlalchemy,peewee,tortoise,databases,demo]",
]

[project.scripts]
neozen = "neozen.cli:main"

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "nox>=2025.11.12",
    "pre-commit>=4.5.1",
    "pyrefly>=0.47.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
    # Test dependencies
    "trio>=0.27.0",
    "aiosqlite>=0.21.0",
    "phonenumbers>=9.0.0",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "advanced-alchemy>=0.30.0",
    # Storage backends for testing
    "peewee>=3.17.0",
    "tortoise-orm>=0.22.0",
    "databases[aiosqlite]>=0.9.0",
    # Demo dependencies
    "starlette>=0.40.0",
    "litestar>=2.0.0",
    "flask[async]>=3.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.0.0",
    "python-multipart>=0.0.21",
    # TOTP dependencies
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    # WebAuthn dependencies
    "webauthn>=2.0.0",
    # Type stubs
    "types-qrcode>=1.0.0",
    "pytest-archon>=0.0.7",
    "pytest-asyncio>=1.3.0",
    "types-peewee>=4.0.0.20260223",
    "pylint>=4.0.5",
    "mkdocs-material>=9.7.6",
]
playwright = [
    "pytest-playwright>=0.7.0",
]

#
# Tools
#

[tool.uv]
# The playwright group is excluded on musl (Alpine), which has no wheels.
default-groups = ["dev", "playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated, no I/O)",
    "integration: Integration tests (component interactions)",
    "e2e: End-to-end tests (full app/CLI workflows)",
]
filterwarnings = [
    # ldap3 (unmaintained) imports names pyasn1 deprecated.
    "ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3",
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = "qrcode.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ldap3.*"
ignore_missing_imports = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.pyrefly]
preset = "legacy"
ignore-missing-imports = [
    "qrcode.*",
    "ldap3.*",
]
