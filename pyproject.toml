[project]
name = "neozen"
version = "0.1.0"
description = "Streamlined authentication and authorization for modern Python applications"
readme = "README.md"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.12"
dependencies = [
    "advanced-alchemy>=1.8.2",
    "anyio>=4.0.0",
    "asyncpg>=0.31.0",
    "dishka>=1.0.0",
    "email-validator>=2.3.0",
    "litestar[standard]>=2.19.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
password = [
    "pwdlib[argon2]>=0.3.0",
]
phone = [
    "phonenumbers>=9.0.0",
]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
    "advanced-alchemy>=0.30.0",
]
peewee = [
    "peewee>=3.17.0",
    "aiosqlite>=0.21.0",  # For async SQLite support
]
tortoise = [
    "tortoise-orm[asyncpg]>=0.22.0",
    "aiosqlite>=0.21.0",
]
databases = [
    "databases[aiosqlite]>=0.9.0",
]
demo = [
    "starlette>=0.40.0",
    "litestar>=2.0.0",
    "flask[async]>=3.0.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.0.0",
]
all = [
    "neozen[password,phone,sqlalchemy,peewee,tortoise,databases,demo]",
]

[project.scripts]
neozen = "neozen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neozen"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "nox>=2025.11.12",
    "pre-commit>=4.5.1",
    "pyrefly>=0.47.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
    # Test dependencies
    "trio>=0.27.0",
    "aiosqlite>=0.21.0",
    "phonenumbers>=9.0.0",
    "pwdlib[argon2]>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "advanced-alchemy>=0.30.0",
    # Storage backends for testing
    "peewee>=3.17.0",
    "tortoise-orm>=0.22.0",
    "databases[aiosqlite]>=0.9.0",
    # Demo dependencies
    "starlette>=0.40.0",
    "litestar>=2.0.0",
    "flask[async]>=3.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.0.0",
    "python-multipart>=0.0.21",
    "pytest-archon>=0.0.7",
    "pytest-asyncio>=1.3.0",
    "types-peewee>=4.0.0.20260223",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, isolated, no I/O)",
    "integration: Integration tests (component interactions)",
    "e2e: End-to-end tests (full app/CLI workflows)",
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
strict_equality = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    "CPY",      # Copyright
    "S101",     # Use of assert
    "D203",     # one-blank-line-before-class
    "D213",     # multi-line-summary-second-line
    "COM812",   # trailing comma
    "T201",     # print
    "ANN",      # annotations (handled by type checkers)
    "D",        # docstrings (for now)
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert
    "PLR2004",  # magic values
    "D",        # docstrings
    "ANN",      # annotations
]

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["neozen"]

[tool.ty.rules]
unused-ignore-comment = "ignore"
