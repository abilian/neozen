target-version = "py312"
preview = true

lint.select = [
    "ALL",
]

include = [
    "src/**/*.py",
    "tests/**/*.py",
    "demos/**/*.py",
]

lint.extend-ignore = [
    # Later (or never)
    "CPY",
    "TC",
    "D",
    "DOC",
    "PLR",
    "TRY",
    "RET",
    "TD",
    "PERF",
    "A",
    "ERA",
    "FIX",

    # False positive
    "S101", # Use of `assert` detected
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "COM812", # ...
    "T201", # Print...
    "PLW1514",
    "PLC1901",

    # Fix later (or not)
    "ANN401",
    "ARG002", # Unused argument - common in watch methods/event handlers
    "PLR0913", # Too many arguments - export functions need them
    "S603", # subprocess call - intentional for $EDITOR
    "BLE001", # Blind exception - acceptable for user-facing error handling
    "SLF001", # Private member access - accessing own class's private attrs
    "PLW2901", # Loop variable overwritten - common strip() pattern
    "ANN003", # Missing **kwargs annotation - common in widget subclasses
    "ANN001", # Missing arg annotation - event handlers
    "S110", # try-except-pass - acceptable for config loading with defaults
    "PLW0603", # global statement - used for singleton config/state
    "TRY300", # return in try block - cleaner for import checks
    "PERF401", # list comprehension - explicit append loop is clearer
    "E501", #  	line-too-long
    "S107", #  	hardcoded-password-default
    "N818", #  	error-suffix-on-exception-name
    "UP049", # 	private-type-parameter
    "DTZ005", #	call-datetime-now-without-tzinfo
    "S106", #  	hardcoded-password-func-arg
    "ARG001", #	unused-function-argument
    "PYI036", #	bad-exit-annotation
    "S105", #  	hardcoded-password-string
    "UP047", # 	non-pep695-generic-function
    "FURB113",
]

[lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "ANN", #  [ ] missing-return-type
    "PLC0415", # [ ] import-outside-top-level
    "B903", #    [ ] class-as-data-structure
    "E402", #    [ ] module-import-not-at-top-of-file
    "RUF100", #  [*] unused-noqa
    "FBT",
]
"**/__init__.py" = [
    "RUF022", # Sort __all__
]
"demos/**/*.py" = [
    "ANN",     # Missing type annotations - demos prioritize readability
    "FBT",     # Boolean trap - acceptable in demo User class
    "PLC0415", # Import outside top-level - lazy imports for optional deps
    "RUF029",  # Unused async - template functions may not await
    "C901",    # Too complex - demo callbacks combine multiple concerns
]

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["neozen"]
