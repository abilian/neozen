target-version = "py312"
preview = true

lint.select = [
    "ALL",
]

include = [
    "src/**/*.py",
    "tests/**/*.py",
    "demos/**/*.py",
    "bench/**/*.py",
]

lint.extend-ignore = [
    # Later (or never)
    "CPY",
    "TC",
    "D",
    "DOC",
    "PLR",
    "TRY",
    "RET",
    "TD",
    "PERF",
    "A",
    "ERA",
    "FIX",

    # False positive
    "S101", # Use of `assert` detected
    "D203", # one-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "COM812", # ...
    "T201", # Print...
    "PLW1514",
    "PLC1901",
    "S105", #   	hardcoded-password-string (false positive)
    "S106", #   	hardcoded-password-func-arg (same)
    "S107", #   	hardcoded-password-default (same)

    # Fix later (or not)
    "ANN401", #  any-type
    "BLE001", #  blind-except
    "SLF001", #  private-member-access
    "E501", #    line-too-long
    "ARG002", #  unused-method-argument
    "ARG001", #  unused-function-argument
    "N818", #    error-suffix-on-exception-name
    "S110", #    try-except-pass
    "FURB113", # repeated-append
    "PLW2901", # redefined-loop-name
    "UP049", #   private-type-parameter
]

[lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "ANN", #  [ ] missing-return-type
    "PLC0415", # [ ] import-outside-top-level
    "PLC2701", # [ ] import-private-name: white-box tests of internal helpers
    "B903", #    [ ] class-as-data-structure
    "E402", #    [ ] module-import-not-at-top-of-file
    "RUF100", #  [*] unused-noqa
    "RUF029", #  async stubs conforming to a protocol may not await
    "FBT",
    "DTZ005",
    "S603",
]
"bench/**/*.py" = [
    "INP001",  # a script directory, not a package
    "RUF029",  # every benchmark shares one async signature
]
"**/__init__.py" = [
    "RUF022", # Sort __all__
]
"demos/**/*.py" = [
    "ANN",     # Missing type annotations - demos prioritize readability
    "FBT",     # Boolean trap - acceptable in demo User class
    "PLC0415", # Import outside top-level - lazy imports for optional deps
    "RUF029",  # Unused async - template functions may not await
    "C901",    # Too complex - demo callbacks combine multiple concerns
]

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["neozen"]
